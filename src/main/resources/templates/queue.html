<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">👨‍⚕️ Clinic Management System</span>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Current Waitlist</h2>
        <span class="badge bg-info text-dark" th:text="${#lists.size(waitingList)} + ' Patients Waiting'">0 Patients</span>
    </div>

    <div class="table-responsive shadow-sm bg-white rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>Token</th>
                <th>Patient Name</th>
                <th>Scheduled Time</th>
                <th>Status</th>
                <th class="text-center">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${waitingList}">
                <td><strong th:text="'#' + ${a.tokenNumber}"></strong></td>
                <td th:text="${a.patientName}">Name</td> <td th:text="${a.time}">Time</td>
                <td>
                    <span class="badge bg-warning text-dark" th:text="${a.status}">Waiting</span>
                </td>
                <td>
                    <form th:action="@{/queue/start/{id}(id=${a.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-primary">Call Patient</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="mt-4">
        <a href="/" class="btn btn-link text-secondary">← Back to Home</a>
    </div>
</div>
</body>
</html>
