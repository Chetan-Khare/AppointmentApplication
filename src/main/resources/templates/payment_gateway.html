<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Secure Payment | Razorpay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { background: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .payment-card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 450px; width: 100%; }
    </style>
</head>
<body>

<div class="card payment-card p-5 text-center">
    <div class="mb-4">
        <i class="bi bi-shield-check text-primary" style="font-size: 4rem;"></i>
    </div>
    <h2 class="fw-bold mb-3">Complete Payment</h2>
    <p class="text-muted mb-4">Click the button below to pay securely via Razorpay.</p>
    
    <button id="rzp-button1" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm py-3">
        Pay Now
    </button>
    
    <div class="mt-4 small text-muted">
        <i class="bi bi-lock-fill"></i> SSL Encrypted & Secure
    </div>
</div>

<script th:inline="javascript">
    // 1. Extract configuration from Thymeleaf
    const config = {
        appointmentId: [[${appointmentId}]],
        publicId: [[${publicId}]],
        razorpayKey: [[${@environment.getProperty('razorpay.key.id')}]],
        csrfToken: [[${_csrf.token}]],
        csrfHeader: [[${_csrf.headerName}]]
    };

    console.log("Payment Config Loaded:", config);
    
    document.getElementById('rzp-button1').onclick = function(e) {
        e.preventDefault();
        console.log("Pay Now clicked for publicId:", config.publicId);

        // 2. Create order on server
        fetch('/api/payment/create-order/' + config.publicId, { 
            method: 'POST',
            headers: {
                [config.csrfHeader]: config.csrfToken
            }
        })
        .then(res => {
            if (!res.ok) {
                return res.text().then(text => { throw new Error(text) });
            }
            return res.json();
        })
        .then(order => {
            console.log("Order created:", order);
            var options = {
                "key": config.razorpayKey,
                "amount": order.amount,
                "currency": "INR",
                "name": "Clinic Booking",
                "description": "Consultation Fee",
                "order_id": order.id,
                "handler": function (response){
                    window.location.href = "/payment/success/" + config.publicId;
                },
                "prefill": {
                    "name": "",
                    "email": ""
                },
                "theme": {
                    "color": "#0d6efd"
                }
            };
            var rzp1 = new Razorpay(options);
            rzp1.open();
        })
        .catch(err => {
            console.error("Payment Error:", err);
            alert("Payment System Error: " + err.message);
        });
    }
</script>

</body>
</html>
