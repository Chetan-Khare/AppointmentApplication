<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clinic Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body { background: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="card login-card p-4">
    <div class="text-center mb-4">
        <h2 class="text-primary fw-bold">👨‍Clinic Portal</h2>
        <p class="text-muted">Enter credentials to access the queue</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger text-center">
        Invalid Username or Password
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-bold">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Username" required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-bold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary rounded-pill shadow-sm fw-bold py-2">
                <i class="bi bi-box-arrow-in-right me-2"></i> Login
            </button>

            <a href="/register" class="btn btn-outline-primary rounded-pill shadow-sm fw-bold py-2">
                <i class="bi bi-person-plus-fill me-2"></i> Create Account
            </a>
        </div>
    </form>

    <div class="text-center mt-4">
        <a href="/" class="btn btn-outline-dark rounded-pill shadow-sm fw-bold py-2">
            <i class="bi bi-arrow-left"></i> Back to Patient Booking
        </a>
    </div>
</div>

</body>
</html>
