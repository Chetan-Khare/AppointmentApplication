<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; height: 100vh; display: flex; align-items: center; }
        .login-card { width: 100%; max-width: 400px; margin: auto; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="card login-card p-4">
    <div class="text-center mb-4">
        <h2 class="text-primary">👨‍⚕️ Staff Portal</h2>
        <p class="text-muted">Enter credentials to access the queue</p>
    </div>

    <div th:if="${error}" class="alert alert-danger p-2 small" th:text="${error}"></div>

    <form action="/login" method="post">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Login to Dashboard</button>
    </form>

    <div class="text-center mt-3">
        <a href="/" class="text-decoration-none small">← Back to Patient Booking</a>
    </div>
</div>
</body>
</html>
