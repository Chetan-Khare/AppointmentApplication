<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointment Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        /* 1. REMOVE HARDCODED BODY COLOR */
        /* Let Bootstrap handle the background color via data-bs-theme */
        body {
            transition: background-color 0.3s, color 0.3s;
        }

        .booking-card { max-width: 500px; margin: 50px auto; border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* 2. Chat Window Styles */
        #chat-window { border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.2); overflow: hidden; }
        .chat-header-gradient { background: linear-gradient(135deg, #007bff 0%, #0056b3 100%); }
        .chat-input-area { padding: 15px; border-top: 1px solid #eee; }

        /* Ensure chat input area adapts to dark mode */
        [data-bs-theme="dark"] .chat-input-area { background-color: #212529; border-top: 1px solid #495057; }
        [data-bs-theme="dark"] .chat-input-pill { background-color: #2b3035; border: 1px solid #495057; color: white; }
        [data-bs-theme="dark"] #chat-content { background-color: #343a40; }

        .chat-input-pill { background: #f4f7f6; border-radius: 30px; padding: 5px 15px; border: 1px solid #e0e0e0; }
        #chat-content { scroll-behavior: smooth; background-color: #f8f9fa; }
    </style>
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand-lg sticky-top shadow-sm bg-body">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="/">
            <span class="fw-bold text-body" style="letter-spacing: -1px; font-size: 1.6rem;">
                Appointment Booking <span class="text-primary">Portal</span>
            </span>
        </a>

        <button class="btn btn-outline-secondary rounded-circle" onclick="toggleDarkMode()">
            <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
        </button>
    </div>
</nav>

<div class="container">
    <div class="card booking-card shadow-lg">
        <div class="card-header bg-primary text-white text-center rounded-top">
            <h3 class="mb-0">🏥 Patient Booking</h3>
        </div>
        <div class="card-body p-4">
            <form action="/book" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold">Full Name</label>
                    <input type="text" name="patientName" class="form-control" placeholder="Enter Your Name " required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address</label>
                    <input type="email" name="patientEmail" class="form-control" placeholder="Enter your Email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Select Doctor</label>
                    <select id="doctorDropdown" name="doctorName" class="form-select" required onchange="fetchSlots()">
                        <option value="" data-id="">Select Doctor</option>

                        <option th:each="doc : ${doctorList}"
                                th:value="${doc.fullName}"
                                th:data-id="${doc.id}"
                                th:text="${doc.fullName}"></option>
                    </select>
                </div>

                <div class="col-md-12 mb-3">
                    <label class="form-label fw-bold">Select Date</label>
                    <input type="date" name="date" class="form-control" id="dateInput" required>
                </div>

                <div class="col-md-12 mb-3">
                    <label class="form-label fw-bold">Available Slots</label>
                    <input type="hidden" name="time" id="selectedTime" required>

                    <div id="slot-container" class="d-flex flex-wrap gap-2">
                        <small class="text-muted">Select a date first...</small>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary">Payment Method</label>
                    <div class="d-flex gap-3">
                        <div class="form-check flex-fill p-0">
                            <input type="radio" class="btn-check" name="paymentMode" id="pay-cash" value="CASH" checked>
                            <label class="btn btn-outline-success w-100 p-3 text-start" for="pay-cash">
                                <i class="bi bi-cash-coin fs-4 me-2"></i>
                                <strong>Pay at Clinic</strong>
                                <div class="small text">Cash / Card</div>
                            </label>
                        </div>

                        <div class="form-check flex-fill p-0">
                            <input type="radio" class="btn-check" name="paymentMode" id="pay-online" value="ONLINE">
                            <label class="btn btn-outline-primary w-100 p-3 text-start" for="pay-online">
                                <i class="bi bi-credit-card fs-4 me-2"></i>
                                <strong>Pay Online</strong>
                                <div class="small text">UPI / Card</div>
                            </label>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Confirm Booking</button>
            </form>
        </div>

        <div class="card-footer text-center bg-body">
            <div class="d-flex justify-content-around">
                <a href="/login" class="text-decoration-none small">Login</a>
                <a href="/display" target="_blank" class="text-decoration-none small">Live Display</a>
            </div>
        </div>
    </div>
</div>

<div id="chat-bubble" onclick="toggleChat()" style="position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: #007bff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 1000;">
    <span style="font-size: 30px; color: white;">💬</span>
</div>

<div id="chat-window" class="card shadow-lg" style="display: none; position: fixed; bottom: 100px; right: 30px; width: 360px; z-index: 1000; border: none;">
    <div class="card-header chat-header-gradient text-white d-flex justify-content-between align-items-center py-3 px-3">
        <div class="d-flex align-items-center gap-2">
            <span style="font-size: 1.5rem;">🩺</span>
            <div>
                <h6 class="mb-0 fw-bold">Clinic Support</h6>
                <small style="opacity: 0.9; font-size: 0.75rem;"><span style="color: #28a745;">●</span> Online</small>
            </div>
        </div>
        <div class="d-flex align-items-center gap-2">
            <button onclick="joinVideo()" class="btn btn-sm btn-light text-primary fw-bold rounded-pill px-3 shadow-sm">
                <i class="bi bi-camera-video-fill"></i> Join
            </button>
            <button onclick="toggleChat()" class="btn-close btn-close-white"></button>
        </div>
    </div>

    <div id="chat-content" class="card-body" style="height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;">
        <div class="p-3 bg-white shadow-sm align-self-start text-dark" style="max-width: 85%; border-radius: 15px 15px 15px 4px; border: 1px solid #efefef;">
            <p class="mb-0" style="font-size: 0.9rem;">👋 <strong>Hi there!</strong><br>
                I'm your virtual assistant. You can ask about appointments or click "Join" if the doctor called you!
            </p>
        </div>
    </div>

    <div class="chat-input-area">
        <div class="input-group chat-input-pill">
            <input type="text" id="user-msg" class="form-control border-0 bg-transparent shadow-none" placeholder="Type a message..." onkeypress="handleKey(event)">
            <button class="btn btn-link text-primary p-0" onclick="sendMessage()"><i class="bi bi-send-fill"></i></button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
    // 1. WEBSOCKET CHAT LOGIC
    var socket = new SockJS('/ws-appointment');
    var stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        stompClient.subscribe('/topic/messages', function (response) {
            appendMessage(response.body, 'bot');
        });
    });

    function toggleChat() {
        const win = document.getElementById('chat-window');
        win.style.display = win.style.display === 'none' ? 'block' : 'none';
    }

    function handleKey(e) { if (e.key === 'Enter') sendMessage(); }

    function sendMessage() {
        var msgInput = document.getElementById('user-msg');
        var text = msgInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        stompClient.send("/app/chat", {}, text);
        msgInput.value = '';
    }

    function appendMessage(text, type) {
        var content = document.getElementById('chat-content');
        var div = document.createElement('div');
        div.className = `p-3 shadow-sm ${type === 'user' ? 'bg-primary text-white align-self-end' : 'bg-white text-dark align-self-start'}`;
        div.style.maxWidth = "85%";
        div.style.borderRadius = type === 'user' ? "15px 15px 4px 15px" : "15px 15px 15px 4px";
        div.innerText = text;
        content.appendChild(div);
        content.scrollTop = content.scrollHeight;
    }

    function joinVideo() {
        let token = prompt("Enter your Token Number to join the video call:");
        if (token) {
            window.open(`https://meet.jit.si/ClinicRoom-${token.trim()}`, '_blank');
        }
    }

    // 2. SMART SLOT FETCHING (Unified & Corrected)
    const dateInput = document.getElementById('dateInput');
    const doctorDropdown = document.getElementById('doctorDropdown');
    const container = document.getElementById('slot-container');

    // Attach listeners to both inputs so slots update automatically
    dateInput.addEventListener('change', fetchSlots);
    doctorDropdown.addEventListener('change', fetchSlots);

    function fetchSlots() {
        const date = dateInput.value;

        // 1. Find the currently selected <option> tag
        const selectedOption = doctorDropdown.options[doctorDropdown.selectedIndex];

        // 2. Extract the hidden data-id (e.g., "1") for the API call
        const doctorId = selectedOption ? selectedOption.getAttribute("data-id") : null;

        // Only fetch if BOTH date and doctor are selected
        if (!date || !doctorId) {
            container.innerHTML = '<small class="text-muted">Select a doctor and date first...</small>';
            return;
        }

        container.innerHTML = '<small class="text-muted">Loading slots...</small>';

        // Fetch using the doctorId, not the name
        fetch(`/api/slots?date=${date}&doctorId=${doctorId}`)
            .then(res => res.json())
            .then(slots => {
                container.innerHTML = '';

                if(slots.length === 0) {
                    container.innerHTML = '<span class="text-danger fw-bold">No slots available (Doctor is fully booked or on leave)</span>';
                    return;
                }

                slots.forEach(time => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'btn btn-outline-primary btn-sm m-1 fw-bold';
                    btn.innerText = time;
                    btn.onclick = function() {
                        document.querySelectorAll('#slot-container button').forEach(b => {
                            b.classList.remove('active');
                            b.classList.replace('btn-primary', 'btn-outline-primary'); // reset colors
                        });
                        this.classList.add('active');
                        this.classList.replace('btn-outline-primary', 'btn-primary'); // Highlight selection
                        document.getElementById('selectedTime').value = time;
                    };
                    container.appendChild(btn);
                });
            })
            .catch(err => {
                console.error('Error fetching slots:', err);
                container.innerHTML = '<span class="text-danger">Error loading slots. Please try again.</span>';
            });
    }

    // 3. DARK MODE TOGGLE
    function toggleDarkMode() {
        const html = document.documentElement;
        const current = html.getAttribute('data-bs-theme');
        const next = current === 'dark' ? 'light' : 'dark';

        html.setAttribute('data-bs-theme', next);

        const icon = document.getElementById('theme-icon');
        icon.className = next === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
    }
</script>
</body>
</html>
