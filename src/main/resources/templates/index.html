<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clinic Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body { background-color: #f4f7f6; }
        .booking-card { max-width: 500px; margin: 50px auto; border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #2c3e50; border: none; }
        .btn-primary:hover { background-color: #1a252f; }

        /* --- NEW CHAT STYLES (REQUIRED FOR MODERN LOOK) --- */
        #chat-window {
            border: none;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .chat-header-gradient {
            background: linear-gradient(135deg, #20bf6b, #0fb9b1); /* Fresh Green/Teal Gradient */
        }

        /* Glassy Button Effect */
        .btn-glass {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
            color: white;
        }

        /* Modern Input Area */
        .chat-input-area {
            background: #ffffff;
            border-top: 1px solid #f0f0f0;
            padding: 15px;
        }
        .chat-input-pill {
            background: #f1f3f5;
            border-radius: 30px;
            padding: 5px 15px;
        }

        /* Custom Scrollbar */
        #chat-content::-webkit-scrollbar { width: 6px; }
        #chat-content::-webkit-scrollbar-thumb { background-color: #cbd5e0; border-radius: 10px; }

        /* Force Round Bubbles */
        #chat-content div { border-radius: 18px !important; font-size: 0.95rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top shadow-sm bg-white">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="/">
            <span class="fw-bold text-dark" style="letter-spacing: -1px; font-size: 1.6rem;">
                Appointment Management <span class="text-primary">Portal</span>
            </span>
        </a>
    </div>
</nav>

<div id="chat-bubble" onclick="toggleChat()" style="position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: #25d366; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 1000;">
    <span style="font-size: 30px; color: white;">💬</span>
</div>

<div id="chat-window" class="card" style="display: none; position: fixed; bottom: 100px; right: 30px; width: 360px; z-index: 1000;">

    <div class="card-header chat-header-gradient text-white d-flex justify-content-between align-items-center py-3 px-3">
        <div class="d-flex align-items-center gap-2">
            <span style="font-size: 1.5rem;">🩺</span>
            <div>
                <h6 class="mb-0 fw-bold">Clinic Support</h6>
                <small style="opacity: 0.9; font-size: 0.75rem;">● Online</small>
            </div>
        </div>

        <div class="d-flex align-items-center gap-2">
            <button onclick="joinVideo()" class="btn btn-sm btn-light text-success fw-bold rounded-pill d-flex align-items-center gap-2 px-3 shadow-sm" title="Join Video Call">
                <i class="bi bi-camera-video-fill"></i>
                <span class="d-none d-sm-inline" style="font-size: 0.9rem;">Join Call</span>
            </button>
            <button onclick="toggleChat()" class="btn-close btn-close-white" style="opacity: 0.8;"></button>
        </div>
    </div>

    <div id="chat-content" class="card-body bg-light" style="height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-color: #f8f9fa;">
        <div class="p-3 bg-white shadow-sm align-self-start text-dark" style="max-width: 85%; border-bottom-left-radius: 4px !important;">
            👋 <strong>Hi there!</strong><br>
            I'm your virtual assistant. You can ask about appointments or click "Join" if the doctor called you!
        </div>
    </div>

    <div class="chat-input-area">
        <div class="input-group chat-input-pill">
            <input type="text" id="user-msg" class="form-control border-0 bg-transparent shadow-none" placeholder="Type a message..." onkeypress="handleKey(event)" style="font-size: 0.9rem;">
            <button class="btn btn-link text-success text-decoration-none fw-bold p-0 pe-2" onclick="sendMessage()" style="font-size: 1.2rem;">
                <i class="bi bi-send-fill"></i>
            </button>
        </div>
    </div>
</div>

<div th:if="${errorMessage}" class="alert alert-danger shadow-sm mb-4" role="alert">
    <strong>⚠️ Oops!</strong> <span th:text="${errorMessage}">Error details here</span>
</div>

<div class="container">
    <div class="card booking-card">
        <div class="card-header bg-primary text-white text-center rounded-top">
            <h3 class="mb-0">🏥 Patient Booking</h3>
        </div>
        <div class="card-body p-4">
            <form action="/book" method="post">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="patientName" class="form-control" placeholder="Enter Patient Name" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Preferred Date</label>
                        <input type="date" name="date" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Time Slot</label>
                        <input type="time" name="time" class="form-control" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Confirm Booking</button>
            </form>
        </div>
        <div class="card-footer text-center bg-white">
            <div class="d-flex justify-content-around">
                <a href="/login" class="text-decoration-none small">Doctor Login</a>
                <a href="/display" target="_blank" class="text-decoration-none small">Live Display</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
    var socket = new SockJS('/ws-appointment');
    var stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        stompClient.subscribe('/topic/messages', function (response) {
            appendMessage(response.body, 'bot');
        });
    });

    function toggleChat() {
        const win = document.getElementById('chat-window');
        win.style.display = win.style.display === 'none' ? 'block' : 'none';
    }

    function handleKey(e) { if (e.key === 'Enter') sendMessage(); }

    function sendMessage() {
        var msgInput = document.getElementById('user-msg');
        if (!msgInput.value.trim()) return;

        appendMessage(msgInput.value, 'user');
        stompClient.send("/app/chat", {}, msgInput.value);
        msgInput.value = '';
    }

    function appendMessage(text, type) {
        var content = document.getElementById('chat-content');
        var div = document.createElement('div');
        div.className = `p-2 rounded shadow-sm ${type === 'user' ? 'bg-primary text-white align-self-end' : 'bg-white align-self-start'}`;
        div.style.maxWidth = "80%";
        div.innerText = text;
        content.appendChild(div);
        content.scrollTop = content.scrollHeight;
    }

    // --- HERE IS THE JOIN FUNCTION (INSIDE THE SCRIPT TAGS) ---
    function joinVideo() {
        // 1. Ask patient for their Token Number
        let token = prompt("Please enter your Token Number to join the video call:");

        // 2. Open the secure Jitsi room
        if (token) {
            const roomName = "ClinicApp-Token-" + token.trim();
            window.open(`https://meet.jit.si/${roomName}`, '_blank');
        }
    }
</script>
</body>
</html>
