<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reception | Patient Queue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --primary-color: #0d6efd; --bg-color: #f8f9fc; }
        body { background-color: var(--bg-color); font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #ffffff; border-bottom: 2px solid #e3e6f0; }
        .dashboard-card { border: none; border-radius: 12px; box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.1); background: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold text-dark" href="#">
            <span class="text-primary"><i class="bi bi-building"></i> Reception</span> Portal
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="fw-bold text-dark" th:text="${staffName}">Staff Member</span>
            <a href="/login" class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-bold">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <h2 class="fw-bold mb-0 text-dark">Front Desk Queue</h2>
        <span class="badge bg-primary rounded-pill px-3 py-2">Live Updates</span>
    </div>

    <div class="card dashboard-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table align-middle mb-0 table-hover">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Token</th>
                        <th>Patient Name</th>
                        <th>Time</th>
                        <th>Payment Status</th>
                        <th>Queue Status</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${appointments}">
                        <td class="ps-4 fw-bold text-primary">
                            #<span th:text="${a.tokenNumber}">101</span>
                        </td>
                        <td th:text="${a.patientName}">Name</td>
                        <td th:text="${a.time}">09:00</td>

                        <td>
                            <div th:if="${a.paymentStatus == 'PAID'}">
                                <span class="badge bg-success rounded-pill"><i class="bi bi-check-circle"></i> PAID</span>
                            </div>
                            <div th:if="${a.paymentStatus != 'PAID'}">
                                <span class="badge bg-danger rounded-pill mb-1">Unpaid</span>
                                <a th:href="@{/staff/markPaid/{id}(id=${a.id})}"
                                   class="btn btn-outline-success btn-sm py-0 px-2 shadow-sm ms-2">
                                    <i class="bi bi-cash"></i> Collect
                                </a>
                            </div>
                        </td>

                        <td>
                            <span th:if="${a.status == 'WAITING'}" class="badge bg-warning text-dark">Waiting</span>
                            <span th:if="${a.status == 'IN_PROGRESS'}" class="badge bg-primary">With Doctor</span>
                        </td>

                        <td class="text-center">
                            <a th:href="@{/staff/cancel/{id}(id=${a.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Cancel this appointment?');">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
