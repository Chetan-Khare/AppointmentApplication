<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Account - AMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f4f7f6; /* Matches your project theme */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .register-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            background: white;
            padding: 40px;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
        }
        .form-control:focus {
            background-color: #fff;
            box-shadow: none;
            border-color: #0d6efd;
        }
        .btn-primary {
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            background: #0d6efd;
            border: none;
        }
        .btn-primary:hover {
            background: #0b5ed7;
        }
        .brand-icon {
            font-size: 3rem;
            color: #0d6efd;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <div class="register-card">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill brand-icon"></i>
                    <h3 class="fw-bold mt-2 text-dark">Create Account</h3>
                    <p class="text-muted small">Join our patient portal today for keeping record of appointment...</p>
                </div>

                <div th:if="${param.success}" class="alert alert-success d-flex align-items-center mb-4">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <div>
                        Success! You can now <a href="/login" class="alert-link">Login</a>.
                    </div>
                </div>

                <form th:action="@{/register/save}" th:object="${user}" method="post">

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                            <input type="text" th:field="*{fullName}" class="form-control border-start-0" placeholder="Your Name" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                            <input type="email" th:field="*{email}" class="form-control border-start-0" placeholder="Your@Email.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                            <input type="password" th:field="*{password}" class="form-control border-start-0" placeholder="Create a strong password" required>
                        </div>
                    </div>

                    <input type="hidden" name="role" value="PATIENT">

                    <button type="submit" class="btn btn-primary w-100 shadow-sm">
                        Register Now
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">Already have an account?</p>
                    <a href="/login" class="fw-bold text-decoration-none">Log in</a>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
