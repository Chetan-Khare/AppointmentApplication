<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Account - AMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4">Create New Account</h2>

            <div th:if="${param.success}" class="alert alert-success">
                Registration successful! You can now <a href="/login">Login</a>.
            </div>

            <form th:action="@{/register/save}" th:object="${user}" method="post">

                <div class="mb-3">
                    <label>Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" th:field="*{password}" class="form-control" required>
                </div>

                <input type="hidden" name="role" value="PATIENT">

                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>

            <p class="mt-3 text-center">
                Already have an account? <a href="/login">Login here</a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
