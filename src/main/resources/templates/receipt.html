<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Booking Confirmed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow mx-auto text-center" style="max-width: 500px;">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0"> Booking Confirmed !</h3>
        </div>
        <div class="card-body p-5">
            <h5 class="text-muted mb-3">Your Token Number</h5>
            <h1 class="display-1 fw-bold text-primary mb-3" th:text="${appt.tokenNumber}">#101</h1>

            <p class="lead">Patient: <strong th:text="${appt.patientName}">Patient Name</strong></p>
            <p>Date: <span th:text="${appt.date}">2026-02-10</span> at <span th:text="${appt.time}">10:00</span></p>

            <hr>
            <div class="alert alert-info" th:if="${appt.paymentStatus == 'PAID'}">
                Payment Status: <strong>PAID (Online)</strong>
            </div>
            <div class="alert alert-warning" th:if="${appt.paymentStatus != 'PAID'}">
                Payment Status: <strong>Pay at Counter</strong>
            </div>

            <a href="/" class="btn btn-primary w-100 mt-2">Back to Home</a>

            <a href="/display" target="_blank" class="btn btn-primary w-100 mt-2">
                <i class="bi bi-tv"></i> Go To Live Display
            </a>
        </div>
    </div>
</div>
</body>
</html>
