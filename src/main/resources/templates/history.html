<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Patient History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
        body { background-color: #f4f7f6; }
        .table-container { margin-top: 50px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .page-header { border-bottom: 2px solid #eee; margin-bottom: 30px; padding-bottom: 10px; }
    </style>
</head>
<body>

<div class="container table-container">
  <div class="page-header d-flex justify-content-between align-items-center">
    <h2 class="text-secondary mb-0"><i class="bi bi-clock-history me-2"></i>Appointments History</h2>
    <a href="/queue" class="btn btn-outline-primary btn-sm">
      <i class="bi bi-arrow-left"></i> Back to Queue
    </a>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
      <tr>
        <th>Token</th>
        <th>Patient Name</th>
        <th>Date</th>
        <th>Time</th>
        <th>Final Status</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="a : ${historyList}">
        <td><strong th:text="'#' + ${a.tokenNumber}"></strong></td>
        <td th:text="${a.patientName}" class="fw-bold text-muted"></td>
        <td th:text="${a.date}"></td>
        <td th:text="${a.time}"></td>
        <td>
          <span class="badge bg-success"><i class="bi bi-check-all me-1"></i>Finished</span>
        </td>
      </tr>

      <tr th:if="${#lists.isEmpty(historyList)}">
        <td colspan="5" class="text-center text-muted py-5">
          <i class="bi bi-clipboard-x display-4 d-block mb-3"></i>
          No completed appointments yet today.
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="mt-4 d-flex justify-content-between align-items-center border-top pt-3">
    <span class="text-muted small">Records are saved automatically upon completion.</span>
    <a href="/queue" class="btn btn-primary px-4">
      <i class="bi bi-arrow-left me-2"></i>Return to Active Queue
    </a>
  </div>
</div>

</body>
</html>
