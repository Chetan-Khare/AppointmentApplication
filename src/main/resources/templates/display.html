<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Clinic Board | Display</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        :root {
            --accent: #00d4ff;
            --bg-dark: #0a0c10;
            --card-bg: #161b22;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* Left Section - Main Announcement */
        .main-display {
            background: radial-gradient(circle at center, #1a202c 0%, #0a0c10 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #30363d;
        }

        .token-hero {
            font-size: 16rem;
            font-weight: 900;
            color: var(--accent);
            line-height: 1;
            text-shadow: 0 0 60px rgba(0, 212, 255, 0.4);
            margin: 0;
        }

        .name-hero {
            font-size: 4.5rem;
            font-weight: 400;
            color: #f0f6fc;
            margin-top: -10px;
        }

        .status-label {
            font-size: 1.5rem;
            letter-spacing: 0.5rem;
            color: #8b949e;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        /* Right Section - Info Panel */
        .info-panel {
            height: 100vh;
            background-color: #0d1117;
            padding: 3rem;
            display: flex;
            flex-direction: column;
        }

        .clock-box {
            margin-bottom: 4rem;
        }

        #clock {
            font-size: 4rem;
            font-weight: 700;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            margin: 0;
        }

        /* Notice Box - High Contrast Fix */
        .notice-card {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid var(--accent);
            border-radius: 15px;
            padding: 2rem;
        }

        .notice-title {
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .notice-text {
            color: #ffffff; /* Bright white for readability */
            font-size: 1.2rem;
            line-height: 1.6;
        }

        /* Flash Animation */
        @keyframes alert-pulse {
            0% { background-color: var(--bg-dark); }
            50% { background-color: #1c2128; }
            100% { background-color: var(--bg-dark); }
        }
        .flash-effect { animation: alert-pulse 0.6s ease 3; }
    </style>
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col-md-8 main-display" id="display-container">
            <div class="status-label">Now Serving</div>
            <h1 id="token-display" class="token-hero">--</h1>
            <h2 id="name-display" class="name-hero">Waiting...</h2>
            <h3 id="cabin-display" class="mt-4" style="font-size: 3.5rem; font-weight: 700; color: #ffeb3b; text-shadow: 0 0 20px rgba(255, 235, 59, 0.4); display: none;">
                Proceed to Cabin <span id="cabin-number"></span>
            </h3>

            <div class="mt-5 d-flex align-items-center">
                <span class="spinner-grow spinner-grow-sm text-info me-3" role="status"></span>
                <span class="text fw-bold">LIVE CONNECTION ACTIVE</span>
            </div>
        </div>

        <div class="col-md-4 info-panel">
            <div class="clock-box">
                <p class="text small fw-bold text-uppercase mb-0">Current Time</p>
                <div id="clock">00:00:00</div>
            </div>

            <div class="notice-card shadow">
                <div class="notice-title">📢 NOTICE</div>
                <div class="notice-text">
                    <p>Please keep your <strong>ID Card</strong> or <strong>Appointment Token</strong> ready.</p>
                    <p class="mb-0 text- small">If you miss your call, please visit the reception or call +91-63******* to re-enter the queue.</p>
                </div>
            </div>

            <div class="mt-auto pt-4 border-top border-secondary">
                <div class="d-flex align-items-center">
                    <div class="p-2 bg-success rounded-circle me-3"></div>
                    <div>
                        <div class="fw-bold">Clinic Status</div>
                        <small class="text">All systems operational</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Digital Clock Logic
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. WebSocket Connection
    const socket = new SockJS('/ws-appointment');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        console.log('Connected: ' + frame);
        stompClient.subscribe('/topic/appointment', function (response) {
            const patient = JSON.parse(response.body);
            updateDisplay(patient);
        });
    });

    // 3. Update UI and Trigger Voice
   function updateDisplay(payload) {
    const container = document.getElementById('display-container');

    container.classList.add('flash-effect');
    setTimeout(() => container.classList.remove('flash-effect'), 2000);

    document.getElementById('token-display').innerText = payload.tokenNumber;
    document.getElementById('name-display').innerText = payload.patientName;

    // Show the Cabin number
    document.getElementById('cabin-display').style.display = 'block';
    document.getElementById('cabin-number').innerText = payload.cabin;

    // Trigger Voice Announcement with Cabin
    speakCall(payload.tokenNumber, payload.patientName, payload.cabin);
    setTimeout(() => speakCall(payload.tokenNumber, payload.patientName, payload.cabin), 6000);
}

function speakCall(token, name, cabin) {
    if ('speechSynthesis' in window) {
        // Now the robot voice tells them the specific cabin!
        const message = new SpeechSynthesisUtterance(`Token number ${token}. ${name}. Please proceed to cabin number ${cabin}.`);
        message.rate = 0.85;
        message.pitch = 1.0;
        window.speechSynthesis.speak(message);
    }
}
</script>

</body>
</html>
