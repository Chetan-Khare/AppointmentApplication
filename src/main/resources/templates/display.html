<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Live Clinic Display</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { background-color: #0d1117; color: white; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; align-items: center; }
        .display-card { background: #161b22; border: 2px solid #30363d; border-radius: 20px; padding: 50px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .token-circle { width: 250px; height: 250px; border: 10px solid #58a6ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; }
        .token-number { font-size: 8rem; font-weight: bold; color: #58a6ff; text-shadow: 0 0 20px rgba(88, 166, 255, 0.4); }
        .status-badge { font-size: 1.5rem; letter-spacing: 2px; }
        .patient-name { font-size: 3rem; color: #c9d1d9; }
    </style>
</head>
<body class="container">
<div class="display-card text-center w-100">
    <div class="mb-4">
        <span class="badge bg-success status-badge px-4 py-2 rounded-pill shadow-sm">NOW SERVING</span>
    </div>

    <div class="token-circle">
        <span id="token-display" class="token-number">--</span>
    </div>

    <h2 id="name-display" class="patient-name mt-4">Waiting for next patient...</h2>

    <hr class="my-5 border-secondary">

    <div class="d-flex justify-content-center align-items-center">
        <div class="spinner-grow text-primary me-3" role="status"></div>
        <span class="text-muted fs-4">Live Queue Tracking Active</span>
    </div>
</div>

<script>
        // WebSocket Connection
        var socket = new SockJS('/ws-appointment');
        var stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);

            stompClient.subscribe('/topic/appointment', function (response) {
                var patient = JSON.parse(response.body);

                // 1. Update UI with Animation
                document.getElementById('token-display').innerText = patient.tokenNumber;
                document.getElementById('name-display').innerText = patient.patientName;

                // 2. Add a visual "flash" effect
                const card = document.querySelector('.display-card');
                card.style.borderColor = '#58a6ff';
                setTimeout(() => card.style.borderColor = '#30363d', 1000);

                // 3. Voice Announcement
                let text = "Token Number " + patient.tokenNumber + ", " + patient.patientName + ". Please proceed to the cabin.";
                let speech = new SpeechSynthesisUtterance(text);
                speech.rate = 0.9; // Slightly slower for clarity
                window.speechSynthesis.speak(speech);
            });
        });
    </script>
</body>
</html>
