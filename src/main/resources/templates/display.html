<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="5">
    <title>Waiting Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; color: white; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;}
        .display-card { border: 2px solid #333; background: #222; padding: 60px; border-radius: 30px; min-width: 600px; text-align: center; box-shadow: 0 0 50px rgba(0,255,100,0.1); }
        .token-num { font-size: 180px; font-weight: 800; color: #00ff88; line-height: 1; }
        .patient-name { font-size: 50px; color: #ecf0f1; opacity: 0.9; }
        .blink { animation: blinker 1.5s linear infinite; color: #ffcc00; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>
<div class="display-card">
    <h2 class="text-uppercase tracking-widest mb-4" style="letter-spacing: 5px; color: #888;">Now Serving</h2>

    <div th:if="${currentPatient != null}">
        <div class="token-num" th:text="${currentPatient.tokenNumber}">01</div>
        <div class="patient-name mt-3" th:text="${currentPatient.patientName.substring(0,1)} + '*****'">Jp*****</div>
        <h4 class="blink mt-5">PLEASE PROCEED TO CABIN 1</h4>
    </div>

    <div th:if="${currentPatient == null}">
        <h1 class="display-1">---</h1>
        <p class="text-muted mt-4">Please wait for the next call</p>
    </div>
</div>

<script th:if="${currentPatient != null}">
        window.onload = function() {
            const msg = new SpeechSynthesisUtterance("Token number [[${currentPatient.tokenNumber}]]. Please proceed to the cabin.");
            window.speechSynthesis.speak(msg);
        }
    </script>
</body>
</html>
