<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Appointment History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
        body { background-color: #f4f7f6; }
        .table-container { margin-top: 50px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .page-header { border-bottom: 2px solid #eee; margin-bottom: 30px; padding-bottom: 10px; }
    </style>
</head>
<body>

<div class="container table-container">
  <div class="page-header d-flex justify-content-between align-items-center">
    <h2 class="text-primary mb-0">📄 Appointment Records</h2>
    <a href="/" class="btn btn-outline-secondary btn-sm">← Back to Booking</a>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
      <tr>
        <th>Token</th>
        <th>Patient Name</th>
        <th>Date</th>
        <th>Time</th>
        <th>Current Status</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="a : ${appointments}">
        <td><strong th:text="'#' + ${a.tokenNumber}"></strong></td>
        <td th:text="${a.patientName}" class="fw-bold"></td>
        <td th:text="${a.date}"></td>
        <td th:text="${a.time}"></td>
        <td>
          <span th:if="${a.status == 'WAITING'}" class="badge bg-warning text-dark">Waiting</span>
          <span th:if="${a.status == 'IN_PROGRESS'}" class="badge bg-primary">In Session</span>
          <span th:if="${a.status == 'COMPLETED'}" class="badge bg-success">Finished</span>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(appointments)}">
        <td colspan="5" class="text-center text-muted py-4">No appointments found in the database.</td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="mt-4 d-flex justify-content-end">
    <a href="/queue" class="btn btn-primary">Go to Live Queue →</a>
  </div>
</div>

</body>
</html>
