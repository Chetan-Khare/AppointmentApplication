spring.application.name=AppointmentApplication
# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:appointmentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ckhare2107@gmail.com
spring.mail.password=Ckhare@123
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Allows you to see the database at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Show SQL queries in the console (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update